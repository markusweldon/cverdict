name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The functions (link previews, vendor feeds) run as plain Node ESM: check them with Node's
      # own resolution rules (every relative import needs its .js extension), then compile and
      # import each.
      - name: Check the functions as Node ESM
        run: |
          npx tsc -p api/tsconfig.json
          npx tsc -p api/tsconfig.json --noEmit false --outDir "$RUNNER_TEMP/api-check"
          echo '{"type":"module"}' >"$RUNNER_TEMP/api-check/package.json"
          for fn in share feed; do
            node -e 'import(process.argv[1]).then((m) => { if (typeof m.GET !== "function" || m.HEAD !== m.GET) throw new Error(process.argv[1] + " must export GET and HEAD"); })' "$RUNNER_TEMP/api-check/api/$fn.js"
          done

      - run: npm test

      - name: Build site
        env:
          BASE: /
        run: npm run build

      # Link previews need an absolute og:image inside the share block of the built page.
      - name: Check the built share block
        run: |
          grep -q '<!--share:start-->' site/dist/index.html
          grep -q '<!--share:end-->' site/dist/index.html
          grep -q '<meta property="og:image" content="https://[^"]*/og/site.png?v=[0-9a-f]\{8\}" />' site/dist/index.html

      - name: Build the MCP server
        run: npm run build:mcp

      # The bundle started over stdio the way an MCP client starts it, against mock data served
      # on localhost: every tool must answer.
      - name: MCP smoke test
        run: |
          npx tsx scripts/mock-data.ts "$RUNNER_TEMP/mcp-data"
          npx tsx mcp/test/smoke.ts mcp/dist/cverdict-mcp.mjs "$RUNNER_TEMP/mcp-data"

      # action/dist/index.mjs is committed (a JavaScript action runs it as is): it must be the build
      # of cli/src at this commit. After changing cli/src, shared or site/src/check, run
      # npm run build:cli and commit action/dist.
      - name: Check the Action bundle is built from the source
        run: |
          CHECK_ENTRY=action CHECK_OUT_DIR="$RUNNER_TEMP/action-dist" npx vite build --config cli/vite.config.ts
          if ! cmp -s action/dist/index.mjs "$RUNNER_TEMP/action-dist/index.mjs"; then
            echo "::error file=action/dist/index.mjs::action/dist/index.mjs is out of date. Run npm run build:cli and commit it."
            exit 1
          fi

      # The CLI bundle against mock data: exit 1 with an Exploited CVE at the default fail-on, 0 with
      # --fail-on never, 2 with nothing to check.
      - name: CLI smoke test
        run: |
          npm run build:cli
          set +e
          node cli/dist/cverdict-check.mjs site/src/check/fixtures --data "$RUNNER_TEMP/mcp-data" >/dev/null; a=$?
          node cli/dist/cverdict-check.mjs site/src/check/fixtures --data "$RUNNER_TEMP/mcp-data" --fail-on never --format sarif -o "$RUNNER_TEMP/cli.sarif"; b=$?
          node cli/dist/cverdict-check.mjs docs --data "$RUNNER_TEMP/mcp-data" 2>/dev/null; c=$?
          set -e
          echo "exit codes: $a $b $c"
          test "$a $b $c" = "1 0 2"
          jq -e '.version == "2.1.0" and (.runs[0].results | length) > 0' "$RUNNER_TEMP/cli.sarif"

      # The Action as a workflow uses it, from this checkout, against the same mock data.
      - name: Action smoke test
        id: check
        uses: ./action
        with:
          path: site/src/check/fixtures
          fail-on: never
          annotations: false
          data-url: ${{ runner.temp }}/mcp-data
          sarif-file: ${{ runner.temp }}/action.sarif

      - name: Check the Action's outputs
        env:
          FAILED: ${{ steps.check.outputs.failed }}
          EXPLOITED: ${{ steps.check.outputs.exploited }}
          SARIF: ${{ steps.check.outputs.sarif-file }}
        run: |
          test "$FAILED" = false
          test "$EXPLOITED" -gt 0
          jq -e '(.runs[0].results | length) > 0' "$SARIF"

      # The cverdict package as npm lays it out (both tools in node_modules beside it): check's exit
      # codes come through, and the MCP server answers every tool when started as `cverdict mcp`.
      - name: Dispatcher smoke test
        run: |
          d="$RUNNER_TEMP/dispatch"
          mkdir -p "$d/node_modules"
          cp -R dispatcher "$d/cverdict"
          ln -s "$PWD/cli" "$d/node_modules/cverdict-check"
          ln -s "$PWD/mcp" "$d/node_modules/cverdict-mcp"
          node "$d/cverdict/bin/cverdict.mjs" --version
          set +e
          node "$d/cverdict/bin/cverdict.mjs" check site/src/check/fixtures --data "$RUNNER_TEMP/mcp-data" >/dev/null; a=$?
          node "$d/cverdict/bin/cverdict.mjs" nope 2>/dev/null; b=$?
          set -e
          test "$a $b" = "1 2"
          npx tsx mcp/test/smoke.ts "$d/cverdict/bin/cverdict.mjs" "$RUNNER_TEMP/mcp-data" mcp

      # shellcheck ships with the ubuntu runner image.
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      # Publishes mock data to a throwaway local remote: creates the branch, writes the notices the
      # CVE Terms of Use require, and skips a second publish of the same content.
      - name: Test the data-branch publisher
        run: |
          npx tsx scripts/mock-data.ts "$RUNNER_TEMP/data"
          # The mock data must pass the same checks as a real run's output.
          npx tsx scripts/validate-data.ts "$RUNNER_TEMP/data"
          remote="$RUNNER_TEMP/publish-test.git"
          git init --quiet --bare "$remote"
          git remote add publish-test "$remote"
          export PUBLISH_REMOTE=publish-test
          bash scripts/publish-data-branch.sh "$RUNNER_TEMP/data"
          readme=$(git --git-dir="$remote" show data:README.md)
          grep -q 'Copyright © 1999-[0-9]\{4\}, The MITRE Corporation' <<<"$readme"
          grep -q 'MITRE hereby grants you' <<<"$readme"
          again=$(bash scripts/publish-data-branch.sh "$RUNNER_TEMP/data")
          grep -q 'nothing to publish' <<<"$again"
          # Older data (a re-run of an old run's publish job) never replaces newer data.
          cp -R "$RUNNER_TEMP/data" "$RUNNER_TEMP/older"
          jq '.generated_at = "2000-01-01T00:00:00.000Z"' "$RUNNER_TEMP/data/v1/meta.json" >"$RUNNER_TEMP/older/v1/meta.json"
          if bash scripts/publish-data-branch.sh "$RUNNER_TEMP/older" 2>"$RUNNER_TEMP/older.log"; then exit 1; fi
          grep -q 'already holds newer data' "$RUNNER_TEMP/older.log"

      - name: Check vercel.json is valid JSON
        run: node -e 'JSON.parse(require("node:fs").readFileSync("vercel.json", "utf8"))'
