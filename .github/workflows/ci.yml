name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # The link-preview function runs as plain Node ESM: check it with Node's own resolution
      # rules (every relative import needs its .js extension), then compile it and import it.
      - name: Check the link-preview function as Node ESM
        run: |
          npx tsc -p api/tsconfig.json
          npx tsc -p api/tsconfig.json --noEmit false --outDir "$RUNNER_TEMP/api-check"
          echo '{"type":"module"}' >"$RUNNER_TEMP/api-check/package.json"
          node -e 'import(process.argv[1]).then((m) => { if (typeof m.GET !== "function" || m.HEAD !== m.GET) throw new Error("api/share.ts must export GET and HEAD"); })' "$RUNNER_TEMP/api-check/api/share.js"

      - run: npm test

      - name: Build site
        env:
          BASE: /
        run: npm run build

      # Link previews need an absolute og:image inside the share block of the built page.
      - name: Check the built share block
        run: |
          grep -q '<!--share:start-->' site/dist/index.html
          grep -q '<!--share:end-->' site/dist/index.html
          grep -q '<meta property="og:image" content="https://[^"]*/og/site.png?v=[0-9a-f]\{8\}" />' site/dist/index.html

      # shellcheck ships with the ubuntu runner image.
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      # Publishes mock data to a throwaway local remote: creates the branch, writes the notices the
      # CVE Terms of Use require, and skips a second publish of the same content.
      - name: Test the data-branch publisher
        run: |
          npx tsx scripts/mock-data.ts "$RUNNER_TEMP/data"
          # The mock data must pass the same checks as a real run's output.
          npx tsx scripts/validate-data.ts "$RUNNER_TEMP/data"
          remote="$RUNNER_TEMP/publish-test.git"
          git init --quiet --bare "$remote"
          git remote add publish-test "$remote"
          export PUBLISH_REMOTE=publish-test
          bash scripts/publish-data-branch.sh "$RUNNER_TEMP/data"
          readme=$(git --git-dir="$remote" show data:README.md)
          grep -q 'Copyright © 1999-[0-9]\{4\}, The MITRE Corporation' <<<"$readme"
          grep -q 'MITRE hereby grants you' <<<"$readme"
          again=$(bash scripts/publish-data-branch.sh "$RUNNER_TEMP/data")
          grep -q 'nothing to publish' <<<"$again"
          # Older data (a re-run of an old run's publish job) never replaces newer data.
          cp -R "$RUNNER_TEMP/data" "$RUNNER_TEMP/older"
          jq '.generated_at = "2000-01-01T00:00:00.000Z"' "$RUNNER_TEMP/data/v1/meta.json" >"$RUNNER_TEMP/older/v1/meta.json"
          if bash scripts/publish-data-branch.sh "$RUNNER_TEMP/older" 2>"$RUNNER_TEMP/older.log"; then exit 1; fi
          grep -q 'already holds newer data' "$RUNNER_TEMP/older.log"

      - name: Check vercel.json is valid JSON
        run: node -e 'JSON.parse(require("node:fs").readFileSync("vercel.json", "utf8"))'
