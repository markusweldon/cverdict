# Hourly data refresh (docs/SPEC.md §4): build the JSON tree from public sources, publish it to the
# orphan `data` branch, and — when GitHub Pages is set to deploy from GitHub Actions — deploy the
# site with the fresh data. A watchdog job then checks the data users actually get.
name: refresh-data

on:
  schedule:
    # Minute 17 avoids the top-of-the-hour scheduling rush.
    - cron: '17 * * * *'
  workflow_dispatch:

# Runs queue instead of overlapping, and an in-flight publish is never cancelled.
concurrency:
  group: refresh-data
  cancel-in-progress: false

# Every job declares what it needs; nothing is granted by default.
permissions: {}

env:
  # Must match BRAND.dataBranch in shared/brand.ts.
  DATA_BRANCH: data

jobs:
  data:
    name: Build and publish data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the data branch
      pages: read # read the Pages configuration
    outputs:
      pages-enabled: ${{ steps.pages.outputs.enabled }}
      pages-base: ${{ steps.pages.outputs.base }}
    steps:
      # The write token is not left in .git/config while dependencies install and the pipeline
      # processes untrusted data; only the two steps that talk to origin receive it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Detect GitHub Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          enabled=false
          if pages=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '[.build_type, .html_url] | @tsv' 2>"$RUNNER_TEMP/pages.err"); then
            IFS=$'\t' read -r build_type url <<<"$pages"
            if [ "$build_type" = workflow ]; then
              enabled=true
              # Serve under the path Pages uses: /<repo>/, or / for user sites and custom domains.
              base=$(sed -E 's#^https?://[^/]+##' <<<"${url:-/${GITHUB_REPOSITORY#*/}/}")
              base="/${base#/}"
              echo "base=${base%/}/" >>"$GITHUB_OUTPUT"
              echo "url=$url" >>"$GITHUB_OUTPUT"
              echo "GitHub Pages deploys from Actions at $url"
            else
              echo "::notice title=GitHub Pages::Pages builds from a branch ($build_type). Set Settings → Pages → Source to GitHub Actions to deploy the site from this workflow."
            fi
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/pages.err"; then
            echo "GitHub Pages is not enabled; skipping the Pages deploy."
          else
            echo "::warning title=GitHub Pages::Could not read the Pages configuration, skipping the deploy: $(head -n 1 "$RUNNER_TEMP/pages.err")"
          fi
          echo "enabled=$enabled" >>"$GITHUB_OUTPUT"

      # Last-good raw downloads. A new key per run plus a prefix restore always picks the newest copy.
      - name: Restore source cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/sources
          key: sources-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sources-

      - name: Check out the published data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"

          status=0
          git ls-remote --exit-code --heads origin "refs/heads/$DATA_BRANCH" >/dev/null || status=$?
          case $status in
            0)
              git fetch --no-tags origin "refs/heads/$DATA_BRANCH"
              mkdir published
              git archive FETCH_HEAD | tar -x -C published
              echo "Previous data: $(git log -1 --format='%h %s' FETCH_HEAD)"
              ;;
            2) echo "No $DATA_BRANCH branch yet (first run): changes.json starts empty." ;;
            *) exit "$status" ;;
          esac

      - name: Run pipeline
        env:
          # Public site URL for links inside the feeds: the repository variable, else the Pages URL,
          # else the pipeline's default.
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.url }}
        run: npm run pipeline -- --out out --previous published --cache .cache

      - name: Save source cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/sources
          key: sources-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Publish data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$GITHUB_SERVER_URL/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $basic"
          bash scripts/publish-data-branch.sh out

      - name: Upload data for Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: data
          path: out/
          retention-days: 1
          if-no-files-found: error

  pages:
    name: Deploy GitHub Pages
    needs: data
    if: needs.data.outputs.pages-enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build site
        env:
          BASE: ${{ needs.data.outputs.pages-base }}
        run: npm run build

      - name: Download the published data
        uses: actions/download-artifact@v4
        with:
          name: data
          path: site/dist/data

      - name: Add feeds and SPA fallback
        run: |
          cp -R site/dist/data/feeds site/dist/feeds
          # Pages serves 404.html for unknown paths; the client-side router takes it from there.
          cp site/dist/index.html site/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

      - id: deploy
        uses: actions/deploy-pages@v4

  # Checks the data users actually get (the branch head), whatever this run's outcome: persistent
  # staleness turns the run red, which notifies the maintainers. The site shows the same age.
  watchdog:
    name: Freshness watchdog
    needs: data
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      # Two missed hourly runs in a row.
      MAX_DATA_AGE_HOURS: 3
      # A source serving its cached copy for longer than this fails the run; shorter is a warning.
      MAX_STALE_HOURS: 48
    steps:
      - name: Check published data
        run: |
          if ! meta=$(gh api "repos/$GITHUB_REPOSITORY/contents/v1/meta.json?ref=$DATA_BRANCH" -H 'Accept: application/vnd.github.raw' 2>"$RUNNER_TEMP/meta.err"); then
            echo "::error title=No published data::Could not read v1/meta.json from the $DATA_BRANCH branch: $(head -n 1 "$RUNNER_TEMP/meta.err")"
            exit 1
          fi
          now=$(date -u +%s)

          {
            echo '### Published data'
            jq -r --argjson now "$now" '
              def ago: if . == null then "–" else (($now - (.[0:19] + "Z" | fromdateiso8601)) / 3600 | floor | "\(.) h ago") end;
              def cell: tostring | gsub("[|\r\n]"; " ");
              "Generated \(.generated_at) (\(.generated_at | ago)) · score model \(.score_model) · \(.counts.window_published) CVEs in the window, \(.counts.window_passed) passed.",
              "",
              "| Source | Status | Records | Data from | Upstream version |",
              "|---|---|--:|---|---|",
              (.sources[]? | "| \(.name | cell) | \(if .ok | not then "**down**" elif .stale then "stale" else "ok" end) | \(.records // "–") | \(.fetched_at | ago) | \(.upstream_version // "–" | cell) |")
            ' <<<"$meta"
          } >>"$GITHUB_STEP_SUMMARY"

          # One workflow command per problem. Upstream error text is escaped so it cannot inject
          # further commands.
          annotations=$(jq -r --argjson now "$now" --argjson max_age "$MAX_DATA_AGE_HOURS" --argjson max_stale "$MAX_STALE_HOURS" '
            def esc: tostring | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A");
            def hours: if . == null then null else ($now - (.[0:19] + "Z" | fromdateiso8601)) / 3600 end;
            (.generated_at | hours) as $data_age
            | (if $data_age > $max_age then
                "::error title=Stale data::Published data is \($data_age | floor) h old (limit \($max_age) h). The site shows this age to users; check the earlier refresh-data runs."
              else empty end),
              (.sources[]? | (.fetched_at | hours) as $age
                | if (.ok | not) then
                    "::error title=Source down (\(.id))::\(.name) has no usable data: \(.error // "unknown error" | esc)"
                  elif .stale and ($age == null or $age > $max_stale) then
                    "::error title=Source stale (\(.id))::\(.name) has served a cached copy for more than \($max_stale) h (data from \(.fetched_at // "unknown")): \(.error // "no error recorded" | esc)"
                  elif .stale then
                    "::warning title=Source stale (\(.id))::\(.name) fell back to its cached copy (data from \(.fetched_at)): \(.error // "no error recorded" | esc)"
                  else empty end)
          ' <<<"$meta")

          if [ -z "$annotations" ]; then
            echo "Published data is fresh and every source is healthy."
            exit 0
          fi
          echo "$annotations"
          if grep -q '^::error' <<<"$annotations"; then
            exit 1
          fi
